name: ROS 2 algorithm validation

on:
  push:
  pull_request:

jobs:
  dependency-free-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest
      - name: Compile Python sources
        run: python -m compileall -q ros2_ws/src
      - name: Run algorithm tests
        run: pytest -q ros2_ws/src/robofest_navigation/test ros2_ws/src/robofest_simulation/test
      - name: Check whitespace
        run: git diff --check

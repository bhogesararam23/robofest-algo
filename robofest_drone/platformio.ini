; PlatformIO Project Configuration File for Robofest Gujarat 6.0 Minefield Swarm Drone
; Mission Computer Target: Seeed Studio XIAO ESP32-S3 Sense (Dual-Core Xtensa LX7 @ 240MHz, 8MB PSRAM, 8MB Flash)
; Flight Controller Target: Matek H743-SLIM V3 (STM32H743 @ 480MHz, Dual IMU MPU6000 + ICM-42605)

[platformio]
default_envs = seeed_xiao_esp32s3
src_dir = .

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Serial diagnostic monitor speed
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder

; Flashing / Upload configuration
upload_speed = 921600

; Compiler and Preprocessor Options
build_unflags = 
    -std=gnu++11

build_flags = 
    -std=gnu++17
    -I src
    -I config
    -I hal
    -Wall
    -Wextra
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM
    -D CAMERA_MODEL_XIAO_ESP32S3_SENSE
    -mfix-esp32-psram-cache-issue

; Source file filtering (includes all core algorithms, calibration, and HAL drivers)
build_src_filter = 
    +<src/*.cpp>
    +<src/calibration/*.cpp>
    +<src/self_test/*.cpp>
    +<hal/*.cpp>

; Pre-build hook (item 19): regenerate/validate vision_profiles_generated.h
extra_scripts = pre:scripts/pio_extra_script.py

[env:esp32s3_generic]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -I src
    -I config
    -I hal
    -Wall
    -Wextra
    -D BOARD_HAS_PSRAM
build_src_filter = 
    +<src/*.cpp>
    +<src/calibration/*.cpp>
    +<src/self_test/*.cpp>
    +<hal/*.cpp>
extra_scripts = pre:scripts/pio_extra_script.py

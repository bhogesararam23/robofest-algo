ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: false
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    twist0: /localization/optical_flow_twist
    # vx and vy from optical flow; vz and angular rates are not fused here.
    twist0_config: [false, false, false, false, false, false, true, true, false, false, false, false, false, false, false]
    pose0: /sensor/tof_pose
    # Absolute ToF altitude only.
    pose0_config: [false, false, true, false, false, false, false, false, false, false, false, false, false, false, false]
    imu0: /sensor/imu
    imu0_config: [false, false, false, true, true, true, false, false, false, false, false, false, false, false, false]
    imu0_remove_gravitational_acceleration: true
